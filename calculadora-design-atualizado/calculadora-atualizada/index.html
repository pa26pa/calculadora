
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Calculadora da LETA</title>
</head>

<body>

    <main class="calculadora">
        <h1>Calculadora da LETA</h1>

        <input id="input" type="text">

        <div class="botoes">
            <button id="mais" onclick="add('+')">+</button>
            <button id="menos" onclick="add('-')">−</button>
            <button id="divisao" onclick="add('/')">÷</button>
            <button id="multiplica" onclick="add('*')">×</button>
            <button id="potencia" onclick="add('**')">xʸ</button>
            <button id="igual" onclick="submit()">=</button>
        </div>
    </main>

    <button onclick="padrao()"> BEDMAS </button>
    <button onclick="editar()">Escolher ordem de operações</button>
    <button onclick="aleatorio()">Aleatorio</button>

    <script src="script.js"></script>

</body>
</html>
