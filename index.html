<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CALCULADORA</title>
</head>
<body>
    <h1>Calculadora da LETA</h1>
    <input id="input" type="text">
    <button id="mais" onclick="add('+')"> + </button>
    <button id="menos" onclick="add('-')"> - </button>
    <button id="divisao" onclick="add('/')">  / </button>
    <button id="multiplica" onclick="add('*')" > * </button>
    <button id="potencia" onclick="add('**')"> ** </button>
    <button id="igual" onclick="submit()"> = </button>

    <script src="script.js"></script>
    
</body>
</html>
